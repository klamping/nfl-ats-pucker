<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Historical comparison</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <main>
      <p id="status" class="status" role="status" aria-live="polite">Loading…</p>

      <section class="target-panel" aria-labelledby="target-heading">
        <div class="section-heading"><h2 id="target-heading">Matchup</h2></div>
        <div class="target-grid">
          <div><h3 id="target-title">Loading…</h3><p id="target-meta" class="muted"></p></div>
          <div class="target-odds"><p class="overline">Current line</p><p id="target-line" class="big-number">—</p></div>
        </div>
        <p id="scope" class="scope"></p>
      </section>

      <section class="profile-section" aria-labelledby="profile-heading">
        <div class="section-heading"><h2 id="profile-heading">Matchup profile</h2></div>
        <div class="table-wrap"><table><caption>Team matchup profile</caption>
          <thead><tr><th scope="col">Metric</th><th scope="col">Away</th><th scope="col">Edge</th><th scope="col">Home</th></tr></thead>
          <tbody id="profile-body"></tbody>
        </table></div>
      </section>

      <section class="summary-section" aria-labelledby="summary-heading">
        <div class="section-heading"><h2 id="summary-heading">Summary</h2></div>
        <div id="summary" class="summary-grid" aria-live="polite"></div>
      </section>

      <section class="trend-section" aria-labelledby="trend-heading">
        <div class="section-heading"><h2 id="trend-heading">Historical trend</h2></div>
        <div id="trend-chart" class="trend-chart"></div>
      </section>

      <section class="results-section" aria-labelledby="results-heading">
        <div class="section-heading"><h2 id="results-heading">Historical games</h2><p id="count-label" class="section-aside"></p></div>
        <div class="board-grid">
          <div class="table-wrap">
            <table>
              <caption>Historical games</caption>
              <thead><tr>
                <th scope="col"><button type="button" id="sort-score">Distance <span aria-hidden="true">↕</span></button></th>
                <th scope="col"><button type="button" id="sort-season">Season <span aria-hidden="true">↕</span></button></th>
                <th scope="col">Matchup</th>
                <th scope="col">Score</th>
                <th scope="col">Home closing line</th>
                <th scope="col">Final margin</th>
                <th scope="col">Vs spread</th>
                <th scope="col"><button type="button" id="sort-outcome">Home ATS <span aria-hidden="true">↕</span></button></th>
                <th scope="col"><button type="button" id="sort-coverage">Coverage <span aria-hidden="true">↕</span></button></th>
              </tr></thead>
              <tbody id="candidate-body"></tbody>
            </table>
          </div>
          <aside id="detail" class="detail-panel" aria-label="Selected historical game" aria-live="polite"></aside>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
